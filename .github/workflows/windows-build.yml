name: Windows standalone

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m PyInstaller --noconfirm --clean NeonArena.spec
      - name: Check packaged app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:NEONARENA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'neonarena-smoke'
          $process = Start-Process -FilePath '.\dist\NeonArena\NeonArena.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Application timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Application failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NeonArena-Windows
          path: dist/NeonArena/
          if-no-files-found: error
